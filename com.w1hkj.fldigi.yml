app-id: com.w1hkj.fldigi
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: fldigi
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=all
  - --share=network
  - --socket=pulseaudio
  - --persist=.fldigi
  - --persist=.fltk
  - --persist=.nbems
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/aclocal
  - /share/doc
  - /share/man
  - '*.a'
  - '*.la'
modules:
  - name: fltk
    sources:
      - type: archive
        url: https://github.com/fltk/fltk/releases/download/release-1.4.5/fltk-1.4.5-source.tar.bz2
        sha256: b5a52489b7ffae196db2076adb4c1b18170db0d047f5e93539a382603461564b
        x-checker-data:
          type: anitya
          project-id: 823
          url-template: https://github.com/fltk/fltk/releases/download/release-$version/fltk-$version-source.tar.bz2
  - name: portaudio
    sources:
      - type: archive
        url: https://github.com/PortAudio/portaudio/archive/refs/tags/v19.7.0.tar.gz
        sha256: 5af29ba58bbdbb7bbcefaaecc77ec8fc413f0db6f4c4e286c40c3e1b83174fa0
        x-checker-data:
          type: anitya
          project-id: 10597
          url-template: https://github.com/PortAudio/portaudio/archive/refs/tags/v$version.tar.gz
  - name: hamlib
    sources:
      - type: archive
        url: https://github.com/Hamlib/Hamlib/releases/download/4.7.2/hamlib-4.7.2.tar.gz
        sha256: ae1fcf2dbc80ea0786ea8f047b09399c3f7737d1930442f61a031708ed33e88f
        x-checker-data:
          type: anitya
          project-id: 1292
          url-template: https://github.com/Hamlib/Hamlib/releases/download/$version/hamlib-$version.tar.gz
  - name: fldigi
    post-install:
      - install -Dm644 com.w1hkj.fldigi.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 com.w1hkj.fldigi.png -t /app/share/icons/hicolor/128x128/apps/
      - install -Dm644 com.w1hkj.fldigi.flarq.png -t /app/share/icons/hicolor/128x128/apps/
      - install -Dm644 com.w1hkj.fldigi.desktop -t /app/share/applications/
      - install -Dm644 com.w1hkj.fldigi.flarq.desktop -t /app/share/applications/
    sources:
      - type: archive
        url: https://www.w1hkj.org/files/fldigi/fldigi-4.2.13.tar.gz
        sha256: a1e8d990359ce9c0cce3ceb5116fd0cf72c95528969766898640ca6ca2dba8d4
        x-checker-data:
          type: anitya
          project-id: 818
          url-template: https://www.w1hkj.org/files/fldigi/fldigi-$version.tar.gz
      - type: patch
        path: fldigi-combobox-empty-entry.patch
      - type: file
        path: com.w1hkj.fldigi.metainfo.xml
      - type: file
        path: com.w1hkj.fldigi.png
      - type: file
        path: com.w1hkj.fldigi.desktop
      - type: file
        path: com.w1hkj.fldigi.flarq.png
      - type: file
        path: com.w1hkj.fldigi.flarq.desktop
